name: Build custom OpenObserve image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-incidents-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, prod]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Build Linux amd64 image using Docker Desktop
        run: bash scripts/build-custom-image.sh

      - name: Upload image artifact without registry publication
        uses: actions/upload-artifact@v4
        with:
          name: oss-incidents-linux-amd64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
